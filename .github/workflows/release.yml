name: Release
# main → build images → deploy to staging.  Tag v* → deploy that image to production
# (protect the "production" environment with required reviewers in the repo settings).
#
# Secrets (per GitHub environment): KUBECONFIG (base64 kubeconfig for the cluster).
# Deploy jobs are skipped until KUBECONFIG is configured.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  BACKUP_IMAGE: ghcr.io/${{ github.repository }}-backup

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.IMAGE }}:${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'latest' }}
          build-args: SENTRY_RELEASE=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backup.Dockerfile
          push: true
          tags: ${{ env.BACKUP_IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.BACKUP_IMAGE }}:latest

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    env:
      OVERLAY: deploy/k8s/overlays/${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
      NAMESPACE: ${{ startsWith(github.ref, 'refs/tags/') && 'anvita' || 'anvita-staging' }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the cluster is configured
        if: env.KUBECONFIG_B64 == ''
        run: echo "::notice::KUBECONFIG secret not set for this environment — image published, deploy skipped."
      - uses: azure/setup-kubectl@v4
        if: env.KUBECONFIG_B64 != ''
      - name: Deploy
        if: env.KUBECONFIG_B64 != ''
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          TAG="${{ needs.images.outputs.tag }}"
          cd "$OVERLAY"
          kubectl kustomize . > /dev/null # validate
          kustomize_edit() { kubectl kustomize . | sed "s#ghcr.io/${{ github.repository }}:latest#$IMAGE:$TAG#; s#ghcr.io/${{ github.repository }}-backup:latest#$BACKUP_IMAGE:$TAG#"; }
          # 1) migrations first (Jobs are immutable: replace the previous one), and wait for them
          kubectl -n "$NAMESPACE" delete job anvita-migrate --ignore-not-found
          kustomize_edit | kubectl -n "$NAMESPACE" apply -l anvita.io/phase=migrate -f -
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/anvita-migrate --timeout=300s
          # 2) then the API, workers and backup CronJob (API keeps serving: maxUnavailable 0)
          kustomize_edit | kubectl -n "$NAMESPACE" apply -l 'anvita.io/phase!=migrate' -f -
          kubectl -n "$NAMESPACE" rollout status deployment/anvita-api --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/anvita-worker --timeout=300s
