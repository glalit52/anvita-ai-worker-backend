name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector so knowledge-search tests cover the vector path too
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anvita
          POSTGRES_PASSWORD: anvita
          POSTGRES_DB: anvita_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anvita" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://anvita:anvita@localhost:5432/anvita_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Migrations are up to date with the schema
        run: npx drizzle-kit check
      - run: npm test
      - run: npm run build
      - name: Built server boots with telemetry preloaded
        env:
          DATABASE_URL: postgres://anvita:anvita@localhost:5432/anvita_test
          PORT: "4100"
          ROLE: api
          MIGRATE_ON_START: "false"
        run: |
          node --import ./dist/telemetry.js dist/main.js &
          for i in $(seq 1 30); do curl -sf localhost:4100/readyz && break; sleep 1; done
          curl -sf localhost:4100/widget.js > /dev/null
          kill %1
      - name: Shell scripts parse
        run: bash -n scripts/backup.sh && bash -n scripts/restore.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t anvita-backend .
      - run: docker build -f deploy/backup.Dockerfile -t anvita-backup .
