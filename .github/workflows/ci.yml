name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anvita
          POSTGRES_PASSWORD: anvita
          POSTGRES_DB: anvita_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anvita" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://anvita:anvita@localhost:5432/anvita_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Migrations are up to date with the schema
        run: npx drizzle-kit check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t anvita-backend .
