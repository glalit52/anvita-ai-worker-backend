# Local stack: Postgres + API + background worker.
#   cp .env.example .env   # set JWT_SECRET / ENCRYPTION_KEY (and ANTHROPIC_API_KEY for real models)
#   docker compose up --build
#   docker compose exec api node dist/db/seed.js   # optional demo data
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: anvita
      POSTGRES_PASSWORD: anvita
      POSTGRES_DB: anvita
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvita"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      ROLE: api
      NODE_ENV: production
      DATABASE_URL: postgres://anvita:anvita@postgres:5432/anvita
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: .
    env_file: .env
    environment:
      ROLE: worker
      NODE_ENV: production
      MIGRATE_ON_START: "false"
      DATABASE_URL: postgres://anvita:anvita@postgres:5432/anvita
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
