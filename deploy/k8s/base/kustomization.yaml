apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - backup-cronjob.yaml
labels:
  - pairs: { app.kubernetes.io/part-of: anvita }
    includeSelectors: false
images:
  - name: anvita-backend
    newName: ghcr.io/glalit52/anvita-ai-worker-backend
    newTag: latest
  - name: anvita-backup
    newName: ghcr.io/glalit52/anvita-ai-worker-backend-backup
    newTag: latest
